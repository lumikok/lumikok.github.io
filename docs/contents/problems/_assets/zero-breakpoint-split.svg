<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="title desc">
<title id="title">关闭一个位置，把连续一段拆成两段</title>
<desc id="desc">字符串111011的下标为1到6，虚拟零位于0和7。关闭位置2前，最近零为0和4，段长为3。关闭后零集合新增2，位置1和3分别成为长度1的段；位置5和6不变。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243247} .small{font-size:13px} .value{font-size:20px;font-weight:600} .label{font-size:15px}</style>
<rect width="800" height="310" rx="12" fill="#fff"/>
<text x="16" y="25" font-size="18" font-weight="600">一个新零断点，只拆开所在的连续一段</text>
<text x="580" y="25" class="small">0* 表示虚拟边界，不计入段长</text>
<text x="16" y="59" class="small">位置</text>
<rect x="184" y="65" width="234" height="55" rx="8" fill="#e9f2ff"/>
<text x="16" y="98" class="label">关闭前</text>
<text x="16" y="244" class="label">关闭后</text>
<text x="141" y="56" text-anchor="middle" class="small">0</text>
<text x="221" y="56" text-anchor="middle" class="small">1</text>
<text x="301" y="56" text-anchor="middle" class="small">2</text>
<text x="381" y="56" text-anchor="middle" class="small">3</text>
<text x="461" y="56" text-anchor="middle" class="small">4</text>
<text x="541" y="56" text-anchor="middle" class="small">5</text>
<text x="621" y="56" text-anchor="middle" class="small">6</text>
<text x="701" y="56" text-anchor="middle" class="small">7</text>
<rect x="112" y="70" width="58" height="44" rx="6" fill="#eef1f5" stroke="#8a95a5" stroke-width="1.2"/>
<text x="141" y="99" text-anchor="middle" class="value">0*</text>
<rect x="192" y="70" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="221" y="99" text-anchor="middle" class="value">1</text>
<rect x="272" y="70" width="58" height="44" rx="6" fill="#fff0db" stroke="#b66d16" stroke-width="2"/>
<text x="301" y="99" text-anchor="middle" class="value">1</text>
<rect x="352" y="70" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="381" y="99" text-anchor="middle" class="value">1</text>
<rect x="432" y="70" width="58" height="44" rx="6" fill="#eef1f5" stroke="#8a95a5" stroke-width="1.2"/>
<text x="461" y="99" text-anchor="middle" class="value">0</text>
<rect x="512" y="70" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="541" y="99" text-anchor="middle" class="value">1</text>
<rect x="592" y="70" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="621" y="99" text-anchor="middle" class="value">1</text>
<rect x="672" y="70" width="58" height="44" rx="6" fill="#eef1f5" stroke="#8a95a5" stroke-width="1.2"/>
<text x="701" y="99" text-anchor="middle" class="value">0*</text>
<rect x="112" y="215" width="58" height="44" rx="6" fill="#eef1f5" stroke="#8a95a5" stroke-width="1.2"/>
<text x="141" y="244" text-anchor="middle" class="value">0*</text>
<rect x="192" y="215" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="221" y="244" text-anchor="middle" class="value">1</text>
<rect x="272" y="215" width="58" height="44" rx="6" fill="#fff0db" stroke="#b66d16" stroke-width="2"/>
<text x="301" y="244" text-anchor="middle" class="value">0</text>
<rect x="352" y="215" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="381" y="244" text-anchor="middle" class="value">1</text>
<rect x="432" y="215" width="58" height="44" rx="6" fill="#eef1f5" stroke="#8a95a5" stroke-width="1.2"/>
<text x="461" y="244" text-anchor="middle" class="value">0</text>
<rect x="512" y="215" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="541" y="244" text-anchor="middle" class="value">1</text>
<rect x="592" y="215" width="58" height="44" rx="6" fill="#f8fbff" stroke="#3973b9" stroke-width="1.2"/>
<text x="621" y="244" text-anchor="middle" class="value">1</text>
<rect x="672" y="215" width="58" height="44" rx="6" fill="#eef1f5" stroke="#8a95a5" stroke-width="1.2"/>
<text x="701" y="244" text-anchor="middle" class="value">0*</text>
<path d="M 195 125 v 7 H 407 v -7" fill="none" stroke="#3973b9" stroke-width="1.5"/>
<text x="141" y="140" text-anchor="middle" class="small">L = 0</text>
<text x="461" y="140" text-anchor="middle" class="small">R = 4</text>
<text x="301" y="155" text-anchor="middle" class="small">旧段长 = 4 - 0 - 1 = 3</text>
<path d="M 55 119 V 204 M 50 197 L 55 204 L 60 197" fill="none" stroke="#b66d16" stroke-width="2"/>
<text x="170" y="186" class="label" fill="#8d510d">关闭位置 2：把 2 加入零断点集合</text>
<text x="170" y="291" class="label">之后关闭位置 3：新边界为 2、4，段长变为 1</text>
</svg>
